// Include common definitions first so plugins and extensions are loaded
apply from: '../build.common.gradle'
// (Optional: if you aren't using build.dependencies.gradle anymore since we put dependencies below, you can omit it)

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = 'https://maven.pedropathing.com' }
    maven { url = 'https://repo.dairy.foundation/releases/' }
    maven { url = 'https://maven.brott.dev/' }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    // FTC SDK Dependencies (Pedro 3 requires SDK 12.0.0)
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'

    // Pedro Pathing 3 Dependencies
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.3'

    // Robot Controller Module & Vision
    implementation project(':FtcRobotController')
    implementation 'org.openftc:easyopencv:1.6.2'

    // Your Custom UI / Panels
    implementation 'com.bylazar:fullpanels:1.0.12'
    implementation "com.bylazar:configurables:1.0.5"

    // Android UI Support
    implementation 'androidx.appcompat:appcompat:1.2.0'
}