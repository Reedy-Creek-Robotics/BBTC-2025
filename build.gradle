/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://maven.brott.dev/' }
    }
    dependencies {
        // Note for FTC Teams: Do not modify this yourself.
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://maven.brott.dev/' }
    }
    // Redirect build directory to a path outside of OneDrive to avoid sync/lock issues
    // Using a project-specific subfolder in C:\temp\gradle-builds
    layout.buildDirectory.set(file("C:/temp/gradle-builds/${rootProject.name}/${project.name}"))
}

repositories {
    mavenCentral()
}
